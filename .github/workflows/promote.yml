name: Promote reviewed bot digest

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full reviewed vcr.vercel.com image@sha256 digest
        required: true
        type: string
      change_ticket:
        description: Incident/change ticket URL or ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-bot
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ inputs.image }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VCR_PROJECT: ${{ vars.VCR_PROJECT }}
      AGENT_PROJECT: ${{ vars.AGENT_VERCEL_PROJECT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - run: bun install --frozen-lockfile

      - name: Validate approval inputs and configuration
        run: |
          set -euo pipefail
          test -n "$CHANGE_TICKET"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_SCOPE"
          test -n "$VCR_PROJECT"
          test -n "$AGENT_PROJECT"

      - name: Log in to VCR
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} vcr login docker
          --project "$VCR_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify exact digest is ready in VCR
        run: bun packages/shared/scripts/release-check.ts image "$IMAGE"

      # Reads GitHub's attestation store, not the registry — VCR refuses cosign's
      # signature mediaType, so `image.yml` publishes there instead. The gate is
      # unchanged in substance: the digest must carry provenance and an SBOM
      # signed by *this* repository's `image.yml` on `main`, or promotion stops.
      - name: Verify publisher identity and signed attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image.yml" \
            --predicate-type https://spdx.dev/Document

      - name: Re-scan reviewed digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ inputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      # Uses the shared script rather than an inline `bun -e`: the repo root
      # declares none of these dependencies, and bun's isolated workspace layout
      # leaves the root `node_modules` holding only the store, so an eval there
      # cannot resolve `@upstash/redis`. The script also owns the Redis key,
      # which this step previously hardcoded beside the constant that defines it.
      - name: Record currently active digest
        id: previous
        run: |
          set -euo pipefail
          previous="$(bun packages/shared/scripts/release-check.ts active)"
          echo "image=$previous" >> "$GITHUB_OUTPUT"

      - name: Link agent project
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment production
          --project "$AGENT_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Set reviewed digest and deploy the agent
        id: deploy
        run: |
          set -euo pipefail
          bunx vercel@${VERCEL_CLI_VERSION} env add BOT_IMAGE production \
            --value "$IMAGE" --yes --force --no-sensitive \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          deployment_url="$(bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      # There is no on-demand reconcile endpoint: the agent's bot-supervisor
      # schedule is the only writer of the generation record, and it fires every
      # five minutes. Promotion therefore waits for a tick plus candidate
      # startup rather than triggering one, and fails if the reviewed digest has
      # not become active within that window.
      - name: Wait for the scheduled reconcile, then verify image and readiness
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 900 ))
          until bun packages/shared/scripts/release-check.ts smoke "$IMAGE"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "reviewed digest did not become active within 15 minutes" >&2
              exit 1
            fi
            echo "waiting for the bot-supervisor schedule to adopt $IMAGE…"
            sleep 30
          done

      - name: Release record
        run: |
          {
            echo "## Production bot promotion"
            echo
            echo "- Change: $CHANGE_TICKET"
            echo "- Previous: \`${{ steps.previous.outputs.image }}\`"
            echo "- Current: \`$IMAGE\`"
            echo "- Supervisor deployment: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
