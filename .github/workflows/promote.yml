name: Promote reviewed bot digest

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full reviewed vcr.vercel.com image@sha256 digest
        required: true
        type: string
      change_ticket:
        description: Incident/change ticket URL or ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-bot
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ inputs.image }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VCR_PROJECT: ${{ vars.VCR_PROJECT }}
      SUPERVISOR_PROJECT: ${{ vars.SUPERVISOR_VERCEL_PROJECT }}
      SUPERVISOR_URL: ${{ vars.SUPERVISOR_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - run: bun install --frozen-lockfile

      - name: Validate approval inputs and configuration
        run: |
          set -euo pipefail
          test -n "$CHANGE_TICKET"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_SCOPE"
          test -n "$VCR_PROJECT"
          test -n "$SUPERVISOR_PROJECT"
          test -n "$SUPERVISOR_URL"
          test -n "$CRON_SECRET"

      - name: Log in to VCR
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} vcr login docker
          --project "$VCR_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify exact digest is ready in VCR
        run: bun packages/shared/scripts/release-check.ts image "$IMAGE"

      - name: Verify publisher identity and signed attestations
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE"
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE" >/dev/null
          cosign verify-attestation --type slsaprovenance --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE" >/dev/null

      - name: Re-scan reviewed digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ inputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Record currently active digest
        id: previous
        run: |
          previous="$(bun -e '
            import { Redis } from "@upstash/redis";
            const redis = Redis.fromEnv();
            let active = await redis.get("wack:bot-sandbox:active:v1");
            if (typeof active === "string") active = JSON.parse(active);
            console.log(active && typeof active === "object" && typeof active.image === "string" ? active.image : "unknown");
          ')"
          echo "image=$previous" >> "$GITHUB_OUTPUT"

      - name: Link supervisor project
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment production
          --project "$SUPERVISOR_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Set reviewed digest and deploy supervisor
        id: deploy
        run: |
          set -euo pipefail
          bunx vercel@${VERCEL_CLI_VERSION} env add BOT_IMAGE production             --value "$IMAGE" --yes --force --no-sensitive             --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          deployment_url="$(bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Reconcile sandbox generation
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             --retry 3 --retry-all-errors --max-time 290             -H "Authorization: Bearer $CRON_SECRET"             "${SUPERVISOR_URL%/}/api/ensure-bot"

      - name: Verify active image and bot readiness
        run: bun packages/shared/scripts/release-check.ts smoke "$IMAGE"

      - name: Release record
        run: |
          {
            echo "## Production bot promotion"
            echo
            echo "- Change: $CHANGE_TICKET"
            echo "- Previous: \`${{ steps.previous.outputs.image }}\`"
            echo "- Current: \`$IMAGE\`"
            echo "- Supervisor deployment: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
