name: Migrate production database and deploy agent

on:
  workflow_dispatch:
    inputs:
      database:
        description: Production Turso database name
        required: true
        type: string
      change_ticket:
        description: Incident/change ticket URL or ID
        required: true
        type: string
      quiesced:
        description: I stopped bot ingress and confirmed in-flight agent writes drained
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  migrate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE: ${{ inputs.database }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
      QUIESCED: ${{ inputs.quiesced }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AGENT_PROJECT: ${{ vars.AGENT_VERCEL_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

      - name: Enforce maintenance gate
        run: |
          set -euo pipefail
          test "$QUIESCED" = "true" || { echo "production writes are not confirmed quiesced" >&2; exit 1; }
          test -n "$CHANGE_TICKET"
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_SCOPE"
          test -n "$AGENT_PROJECT"
          [[ "$DATABASE" =~ ^[a-z0-9][a-z0-9-]*$ ]]

      # Same guarantee the Turso CLI was installed for, without the CLI: a Turso
      # URL is `libsql://<database>-<org>.turso.io`, so the approved name must be
      # the first path-free label of the host.
      - name: Verify configured database identity
        run: |
          set -euo pipefail
          host="${TURSO_DATABASE_URL#*://}"
          case "${host%%.*}" in
            "$DATABASE"|"$DATABASE"-*) ;;
            *) echo "TURSO_DATABASE_URL does not name the approved database" >&2; exit 1 ;;
          esac

      # Turso restores to any point in its retention window on demand, so a clone
      # taken *before* the change is recoverable information, not a recoverable
      # artifact — `turso db create --from-db <db> --timestamp <t>` works just as
      # well after something goes wrong. The clone this replaced cost a whole
      # extra database per migration, none of which anything ever deleted.
      # What was actually needed is the timestamp to restore from.
      - name: Record the restore point
        id: restore_point
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Forward migration
        working-directory: packages/shared
        run: bun run db:migrate

      - name: Verify ledger, schema, and database integrity
        run: bun packages/shared/scripts/verify-database.ts

      - name: Link agent project
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment production
          --project "$AGENT_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy verified agent
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Change record
        run: |
          {
            echo "## Production database change"
            echo
            echo "- Change: $CHANGE_TICKET"
            echo "- Database: \`$DATABASE\`"
            echo "- Restore point: \`${{ steps.restore_point.outputs.at }}\` (turso db create <name> --from-db $DATABASE --timestamp <that>)"
            echo "- Agent deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Bot remains quiesced until operator smoke/re-enable."
          } >> "$GITHUB_STEP_SUMMARY"
