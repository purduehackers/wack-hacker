name: Migrate database

# Applies migrations that are already in the repository. It never generates one:
# `drizzle-kit generate` runs on a developer's machine and its output is
# reviewed in the pull request, where `ci.yml` reports what each statement would
# do and blocks anything that drops or rebuilds data. By the time a migration
# reaches `main` the decision has been made, so this only carries it out.
#
# It also does not deploy. The agent project is connected to `main`, so the code
# that needs the new schema has already shipped by the time this runs; deploying
# again from here rebuilt the whole app to change nothing.

on:
  push:
    branches: [main]
    paths:
      - "packages/shared/migrations/**"
      - "packages/shared/src/db/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

      - name: Require database credentials
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || {
            echo "::error::TURSO_DATABASE_URL is not configured for the production environment" >&2
            exit 1
          }

      # A Turso URL is `libsql://<database>-<org>.turso.io`, so the host's first
      # label names the database this run would alter. Printed rather than
      # matched against an input: there is no second database to confuse it with,
      # and an operator reading the log should see which one moved.
      - name: Name the database being migrated
        run: |
          set -euo pipefail
          host="${TURSO_DATABASE_URL#*://}"
          echo "migrating \`${host%%.*}\`" >> "$GITHUB_STEP_SUMMARY"

      # Turso restores to any point inside its retention window on demand, so
      # what a rollback needs is the timestamp, not a clone taken in advance.
      # The clone this replaced left an extra database behind on every migration
      # and nothing ever deleted them.
      - name: Record the restore point
        id: restore_point
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        working-directory: packages/shared
        run: bun run db:migrate

      - name: Verify ledger, schema, and integrity
        run: bun packages/shared/scripts/verify-database.ts

      - name: Change record
        run: |
          {
            echo "## Database migration"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Restore point: \`${{ steps.restore_point.outputs.at }}\`"
            echo
            echo "To roll back, clone from just before that timestamp:"
            echo
            echo '```bash'
            echo "turso db create <recovery-name> --from-db <database> --timestamp ${{ steps.restore_point.outputs.at }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
