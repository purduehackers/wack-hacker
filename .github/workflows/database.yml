name: Migrate production database and deploy agent

on:
  workflow_dispatch:
    inputs:
      database:
        description: Production Turso database name
        required: true
        type: string
      backup_database:
        description: New database name for the pre-change PITR clone
        required: true
        type: string
      change_ticket:
        description: Incident/change ticket URL or ID
        required: true
        type: string
      quiesced:
        description: I stopped bot ingress and confirmed in-flight agent writes drained
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

env:
  TURSO_CLI_VERSION: 1.0.31
  TURSO_CLI_LINUX_X64_SHA256: 84f5f564f778b3f3df2fee2aa56f0886db9acde654d80e66d95b9e228348d5a0
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  migrate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE: ${{ inputs.database }}
      BACKUP_DATABASE: ${{ inputs.backup_database }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
      QUIESCED: ${{ inputs.quiesced }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AGENT_PROJECT: ${{ vars.AGENT_VERCEL_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Enforce maintenance gate
        run: |
          set -euo pipefail
          test "$QUIESCED" = "true" || { echo "production writes are not confirmed quiesced" >&2; exit 1; }
          test -n "$CHANGE_TICKET"
          test -n "$TURSO_API_TOKEN"
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_SCOPE"
          test -n "$AGENT_PROJECT"
          [[ "$DATABASE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$BACKUP_DATABASE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test "$DATABASE" != "$BACKUP_DATABASE"

      - name: Install checksum-pinned Turso CLI
        run: |
          set -euo pipefail
          archive="turso-cli_Linux_x86_64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2             --output "$archive"             "https://github.com/tursodatabase/turso-cli/releases/download/v${TURSO_CLI_VERSION}/${archive}"
          echo "${TURSO_CLI_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" turso
          install -m 0755 turso /usr/local/bin/turso
          turso --version

      - name: Verify configured database identity
        run: |
          set -euo pipefail
          provider_url="$(turso db show "$DATABASE" --url)"
          test "${provider_url%/}" = "${TURSO_DATABASE_URL%/}" || {
            echo "TURSO_DATABASE_URL does not name the approved database" >&2
            exit 1
          }

      - name: Create pre-change point-in-time clone
        id: backup
        run: |
          set -euo pipefail
          backup_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          turso db create "$BACKUP_DATABASE"             --from-db "$DATABASE" --timestamp "$backup_at" --wait
          turso db show "$BACKUP_DATABASE" --url >/dev/null
          echo "at=$backup_at" >> "$GITHUB_OUTPUT"

      - name: Forward migration
        working-directory: packages/shared
        run: bun run db:migrate

      - name: Verify ledger, schema, and database integrity
        run: bun packages/shared/scripts/verify-database.ts

      - name: Link agent project
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment production
          --project "$AGENT_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy verified agent
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Change record
        run: |
          {
            echo "## Production database change"
            echo
            echo "- Change: $CHANGE_TICKET"
            echo "- Database: \`$DATABASE\`"
            echo "- PITR clone: \`$BACKUP_DATABASE\` at \`${{ steps.backup.outputs.at }}\`"
            echo "- Agent deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Bot remains quiesced until operator smoke/re-enable."
          } >> "$GITHUB_STEP_SUMMARY"
