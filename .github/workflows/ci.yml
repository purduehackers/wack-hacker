name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run validate
      - run: bun run test:contracts:docker
      # drizzle-kit carries a dev-server-only esbuild advisory; no such server is run or shipped.
      - run: bun run audit
      - name: Validate database migrations
        run: |
          database="$(mktemp /tmp/wack-hacker-ci-XXXXXX.db)"
          trap 'rm -f "$database"' EXIT
          cd packages/shared
          TURSO_DATABASE_URL="file:$database" bunx drizzle-kit check
          TURSO_DATABASE_URL="file:$database" bun run db:migrate
      - run: bun run build
      - run: docker build --platform linux/amd64 -f packages/bot/Dockerfile -t wack-hacker-bot:ci .
